<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CampusSync | Auth</title>
<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js/dist/amazon-cognito-identity.min.js"></script>
<style>
:root{--b:#121212;--g:rgba(30,30,30,0.6);--r:rgba(255,255,255,0.08);--t:#e0e0e0;--a:#e67e22}
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;cursor:none}
body{background:var(--b);color:var(--t);display:flex;min-height:100vh;background-image:radial-gradient(circle at 10% 20%,rgba(230,126,34,0.05) 0,var(--b) 90%)}
.nav{width:260px;background:var(--g);backdrop-filter:blur(12px);border-right:1px solid var(--r);padding:30px 20px;display:flex;flex-direction:column}
.nav h2{font-size:24px;font-weight:600;color:var(--t);margin-bottom:40px;text-align:center}
.nav h2 span{color:var(--a)}
.nav a{color:rgba(224,224,224,0.7);text-decoration:none;padding:12px 16px;border-radius:8px;margin-bottom:8px;font-size:15px;transition:0.2s}
.nav a:hover,.nav a.act{background:rgba(230,126,34,0.15);color:var(--a)}
.main{flex:1;padding:40px;overflow-y:auto;position:relative;display:flex;justify-content:center;align-items:center}
.crd{background:var(--g);backdrop-filter:blur(12px);border:1px solid var(--r);border-radius:16px;padding:40px;box-shadow:0 8px 32px 0 rgba(0,0,0,0.37);width:100%;max-width:400px}
h3{font-size:24px;font-weight:600;margin-bottom:20px;color:var(--t);text-align:center}
input,button{width:100%;padding:14px;margin:10px 0;border-radius:8px;border:1px solid var(--r);background:rgba(0,0,0,0.3);color:var(--t)}
button{background:var(--a);color:#fff;border:none;font-weight:600;margin-top:20px}
.lnk{color:var(--a);text-align:center;display:block;margin-top:15px;font-size:14px}
#ca{width:20px;height:20px;border:2px solid var(--a);border-radius:50%;position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-50%)}
#cb{width:6px;height:6px;background:var(--a);border-radius:50%;position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-50%)}
#rf{display:none}
</style>
</head>
<body>
<div id="ca"></div>
<div id="cb"></div>
<div class="nav">
<h2>Campus<span>Sync</span></h2>
<a href="index.html" class="act">Authentication</a>
<a href="dashboard.html">Dashboard</a>
<a href="analytics.html">Analytics</a>
<a href="about.html">Project Info</a>
<a href="contact.html">Contact Support</a>
</div>
<div class="main">
<div class="crd" id="lf">
<h3>System Access</h3>
<input type="text" id="u" placeholder="Username or Email">
<input type="password" id="p" placeholder="Password">
<button onclick="login()">Authenticate</button>
<span class="lnk" onclick="tog(1)">Create new record</span>
</div>
<div class="crd" id="rf">
<h3>Register Record</h3>
<input type="text" id="ru" placeholder="Username">
<input type="email" id="re" placeholder="Email Address">
<input type="password" id="rp" placeholder="Password">
<button onclick="register()">Submit</button>
<span class="lnk" onclick="tog(0)">Return to access</span>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
