<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusSync | Student ERP</title>
<style>
:root{--bg:#121212;--glass:rgba(30,30,30,0.6);--border:rgba(255,255,255,0.08);--text:#e0e0e0;--accent:#e67e22;--accent-dim:#a35614;--shadow:0 8px 32px 0 rgba(0,0,0,0.37)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);display:flex;min-height:100vh;background-image:radial-gradient(circle at 10% 20%,rgba(230,126,34,0.05) 0,rgba(18,18,18,1) 90%)}
.sidebar{width:260px;background:var(--glass);backdrop-filter:blur(12px);border-right:1px solid var(--border);padding:30px 20px;display:flex;flex-direction:column}
.sidebar h2{font-size:1.5rem;font-weight:600;color:var(--text);margin-bottom:40px;text-align:center}
.sidebar h2 span{color:var(--accent)}
.sidebar a{color:rgba(224,224,224,0.7);text-decoration:none;padding:12px 16px;border-radius:8px;margin-bottom:8px;font-size:0.95rem;transition:all 0.2s ease}
.sidebar a:hover,.sidebar a.active{background:rgba(230,126,34,0.15);color:var(--accent)}
.content{flex:1;display:flex;justify-content:center;align-items:center;padding:40px}
.main-container{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:16px;width:100%;max-width:480px;padding:40px;box-shadow:var(--shadow)}
h1{font-size:2rem;font-weight:600;margin-bottom:30px;color:var(--text);text-align:center;letter-spacing:-0.5px}
h1 span{color:var(--accent)}
.form-group{margin-bottom:20px;position:relative}
label{display:block;font-size:0.85rem;color:rgba(224,224,224,0.7);margin-bottom:8px;margin-left:4px}
input{width:100%;padding:14px 16px;background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;transition:all 0.2s ease}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(230,126,34,0.15)}
input::placeholder{color:rgba(224,224,224,0.3)}
button{width:100%;padding:14px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.2s ease;margin-top:10px}
button:hover{background:var(--accent-dim);transform:translateY(-1px)}
button:active{transform:translateY(1px)}
#response-area{margin-top:25px;padding:15px;background:rgba(0,0,0,0.2);border-radius:8px;border:1px solid var(--border);min-height:50px;font-family:monospace;font-size:0.9rem;word-break:break-all;color:rgba(224,224,224,0.8);display:none}
#response-area.visible{display:block;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="sidebar">
<h2>Campus<span>Sync</span></h2>
<a href="index.html" class="active">Registration</a>
<a href="dashboard.html">Dashboard</a>
<a href="analytics.html">Analytics</a>
<a href="about.html">Project Info</a>
<a href="contact.html">Contact Support</a>
</div>
<div class="content">
<div class="main-container">
<h1>Campus<span>Sync</span></h1>
<div class="form-group">
<label for="studentId">Student ID</label>
<input type="text" id="studentId" placeholder="e.g., CST101">
</div>
<div class="form-group">
<label for="studentName">Full Name</label>
<input type="text" id="studentName" placeholder="e.g., John Doe">
</div>
<div class="form-group">
<label for="studentEmail">Email Address</label>
<input type="email" id="studentEmail" placeholder="e.g., john.d@example.edu">
</div>
<div class="form-group">
<label for="studentCourse">Course</label>
<input type="text" id="studentCourse" placeholder="e.g., Computer Science">
</div>
<button onclick="submitStudentData()">Submit Record</button>
<div id="response-area"></div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
