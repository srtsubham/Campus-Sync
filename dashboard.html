<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CampusSync | Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js/dist/amazon-cognito-identity.min.js"></script>
<style>
:root{--b:#121212;--g:rgba(30,30,30,0.6);--r:rgba(255,255,255,0.08);--t:#e0e0e0;--a:#e67e22}
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;cursor:none}
body{background:var(--b);color:var(--t);display:flex;min-height:100vh;background-image:radial-gradient(circle at 10% 20%,rgba(230,126,34,0.05) 0,var(--b) 90%)}
.nav{width:260px;background:var(--g);backdrop-filter:blur(12px);border-right:1px solid var(--r);padding:30px 20px;display:flex;flex-direction:column}
.nav h2{font-size:24px;font-weight:600;color:var(--t);margin-bottom:40px;text-align:center}
.nav h2 span{color:var(--a)}
.nav a{color:rgba(224,224,224,0.7);text-decoration:none;padding:12px 16px;border-radius:8px;margin-bottom:8px;font-size:15px;transition:0.2s}
.nav a:hover,.nav a.act{background:rgba(230,126,34,0.15);color:var(--a)}
.main{flex:1;padding:40px;overflow-y:auto}
.crd{background:var(--g);backdrop-filter:blur(12px);border:1px solid var(--r);border-radius:16px;padding:30px;box-shadow:0 8px 32px 0 rgba(0,0,0,0.37);margin-bottom:30px}
h3{font-size:24px;font-weight:600;margin-bottom:20px;color:var(--t)}
input,button{padding:12px;margin-right:10px;border-radius:8px;border:1px solid var(--r);background:rgba(0,0,0,0.3);color:var(--t)}
button{background:var(--a);color:#fff;border:none}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:14px;text-align:left;border-bottom:1px solid var(--r);font-size:15px}
th{color:var(--a);font-weight:600}
#ca{width:20px;height:20px;border:2px solid var(--a);border-radius:50%;position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-50%)}
#cb{width:6px;height:6px;background:var(--a);border-radius:50%;position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<div id="ca"></div>
<div id="cb"></div>
<div class="nav">
<h2>Campus<span>Sync</span></h2>
<a href="index.html">Authentication</a>
<a href="dashboard.html" class="act">Dashboard</a>
<a href="analytics.html">Analytics</a>
<a href="about.html">Project Info</a>
<a href="contact.html">Contact Support</a>
</div>
<div class="main">
<div class="crd">
<h3>Register Record</h3>
<div style="display:flex">
<input type="text" id="si" placeholder="Student ID">
<input type="text" id="sn" placeholder="Full Name">
<input type="email" id="se" placeholder="Email Address">
<input type="text" id="sc" placeholder="Course">
<button onclick="post()">Submit</button>
</div>
<p id="msg" style="margin-top:15px;color:var(--a)"></p>
</div>
<div class="crd">
<h3>Student Records Directory</h3>
<table>
<thead>
<tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th></tr>
</thead>
<tbody id="tb">
<tr><td colspan="4" style="text-align:center;">Fetching records...</td></tr>
</tbody>
</table>
</div>
</div>
<script src="app.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
