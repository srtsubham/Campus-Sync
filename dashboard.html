<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusSync | Dashboard</title>
<style>
:root{--bg:#121212;--glass:rgba(30,30,30,0.6);--border:rgba(255,255,255,0.08);--text:#e0e0e0;--accent:#e67e22;--accent-dim:#a35614;--shadow:0 8px 32px 0 rgba(0,0,0,0.37)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);display:flex;min-height:100vh;background-image:radial-gradient(circle at 10% 20%,rgba(230,126,34,0.05) 0,rgba(18,18,18,1) 90%)}
.sidebar{width:260px;background:var(--glass);backdrop-filter:blur(12px);border-right:1px solid var(--border);padding:30px 20px;display:flex;flex-direction:column}
.sidebar h2{font-size:1.5rem;font-weight:600;color:var(--text);margin-bottom:40px;text-align:center}
.sidebar h2 span{color:var(--accent)}
.sidebar a{color:rgba(224,224,224,0.7);text-decoration:none;padding:12px 16px;border-radius:8px;margin-bottom:8px;font-size:0.95rem;transition:all 0.2s ease}
.sidebar a:hover,.sidebar a.active{background:rgba(230,126,34,0.15);color:var(--accent)}
.content{flex:1;padding:40px;overflow-y:auto}
.card{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:16px;padding:30px;box-shadow:var(--shadow)}
h3{font-size:1.5rem;font-weight:600;margin-bottom:20px;color:var(--text)}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:14px;text-align:left;border-bottom:1px solid var(--border);font-size:0.95rem}
th{color:var(--accent);font-weight:600}
td{color:rgba(224,224,224,0.8)}
</style>
</head>
<body>
<div class="sidebar">
<h2>Campus<span>Sync</span></h2>
<a href="index.html">Registration</a>
<a href="dashboard.html" class="active">Dashboard</a>
<a href="analytics.html">Analytics</a>
<a href="about.html">Project Info</a>
<a href="contact.html">Contact Support</a>
</div>
<div class="content">
<div class="card">
<h3>Student Records Directory</h3>
<table>
<thead>
<tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th></tr>
</thead>
<tbody id="tb">
<tr><td colspan="4" style="text-align:center;">Fetching records...</td></tr>
</tbody>
</table>
</div>
</div>
<script src="dashboard.js"></script>
</body>
</html>
